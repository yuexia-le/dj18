name: Docker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 这个通常比较小，容易下载成功

      - name: Local Docker Build and Deploy
        run: |
          # 1. 登录阿里云 (使用 Secrets)
          echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login --username=${{ secrets.ALIYUN_REGISTRY_USER }} --password-stdin crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com
          
          # 2. 直接使用本地 Docker 构建镜像
          # 这样就不需要下载 setup-buildx-action 插件了
          docker build -t crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest .
          
          # 3. 推送到阿里云镜像仓库（作为备份）
          docker push crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
          
          # 4. 停止并删除旧容器
          docker rm -f vocab_container || true
          
          # 5. 启动新容器
          docker run -d \
            --name vocab_container \
            --network="host" \
            --restart always \
            -e SILICONFLOW_API_KEY="${{ secrets.SILICONFLOW_API_KEY }}" \
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
          
          # 6. 清理无用镜像
          docker image prune -f