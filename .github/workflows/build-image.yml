name: K8s-Edition CI/CD

on:
  push:
    branches: [ "main" ]

jobs:
  # 第一阶段：云端构建 (CI)
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline

  # 第二阶段：本地部署 (CD)
  deploy:
    needs: build
    runs-on: self-hosted 
    steps:
      # 1. 注入钥匙
      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      # 2. 拉取镜像并注入 Kind
      - name: Load Image to Kind
        run: |
          docker login --username=${{ secrets.ALIYUN_REGISTRY_USER }} --password=${{ secrets.ALIYUN_REGISTRY_PASSWORD }} crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com
          docker pull crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }}
          kind load docker-image crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }} --name kind

      # 3. 确保 MySQL 镜像存在（已修正缩进）
      - name: Ensure Base Images in Kind
        run: |
          if ! docker exec kind-control-plane crictl inspecti mysql:8.0 >/dev/null 2>&1; then
            docker pull mysql:8.0
            kind load docker-image mysql:8.0 --name kind
          fi

      # 4. 滚动更新 K8s Deployment
      - name: Update K8s Deployment
        run: |
          kubectl set image deployment/vocab-app vocab-app=crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }} -n vocab-pro
          kubectl rollout status deployment/vocab-app -n vocab-pro

      # 5. 清理宿主机冗余镜像
      - name: Cleanup
        run: docker image prune -f