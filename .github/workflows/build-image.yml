name: Docker CI

on:
  push:
    branches: [ "main" ]  # 只有推送到 main 才会触发镜像构建
  pull_request:
    branches: [ "main" ]  # 提交针对 main 的合并请求时，可以只跑测试不推镜像

jobs:
  build-and-push:
    # 只有当分支是 main 时，才执行推送镜像的步骤
    if: github.ref == 'refs/heads/main' 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

        # 使用官方 login-action 解决权限传递问题
      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }}
          # 显式使用缓存提高构建速度
          cache-from: type=gha
          cache-to: type=inline