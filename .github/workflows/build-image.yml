name: Docker CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    # 只有合并到 main 才会真正执行以下所有步骤
    if: github.ref == 'refs/heads/main' 
    runs-on: self-hosted  # 使用你 nohup 运行的本地 Runner
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Aliyun Registry
        uses: docker/login-action@v3
        with:
          registry: crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIYUN_REGISTRY_USER }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          provenance: false
          tags: |
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=inline

      - name: Deploy Locally
        run: |
          # 停止并删除旧容器
          docker rm -f vocab_container || true
          
          # 启动新容器并注入 API Key
          docker run -d \
            --name vocab_container \
            --network="host" \
            --restart always \
            -e SILICONFLOW_API_KEY="${{ secrets.SILICONFLOW_API_KEY }}" \
            crpi-8tpi8vcb6euhian5.cn-shenzhen.personal.cr.aliyuncs.com/dsl_taiji/vocab_master:latest
          
          # 清理过期的旧镜像
          docker image prune -f